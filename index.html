<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pickleball</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        ul { list-style: none; padding: 0; }
        li { background: #ecf0f1; padding: 10px; margin-top: 6px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .sync-status { text-align: center; font-size: 14px; color: #7f8c8d; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏓 Pickleball Club</h1>
    <div id="status" class="sync-status">Sincronizado con la nube ☁️</div>

    <!-- Sección Socios -->
    <div class="section">
        <h2>Registrar Socio</h2>
        <input type="text" id="nombreSocio" placeholder="Nombre y Apellidos">
        <button onclick="agregarSocio()">Añadir Socio</button>
        <h3>Listado de Socios</h3>
        <ul id="listaSocios"></ul>
    </div>

    <!-- Sección Clases -->
    <div class="section">
        <h2>Apuntar Clase / Pista</h2>
        <input type="text" id="nombreClase" placeholder="Ej: Clase Martes 18:00">
        <button onclick="agregarClase()">Añadir Clase</button>
        <h3>Clases Disponibles</h3>
        <ul id="listaClases"></ul>
    </div>
</div>

<script>
    const API_URL = "https://api.npoint.io/451d4728d05c351c11fb";

    // Cargar datos al abrir la página
    async function cargarDatos() {
        try {
            document.getElementById('status').innerText = "Cargando datos...";
            let respuesta = await fetch(API_URL);
            let datos = await respuesta.json();
            
            mostrarSocios(datos.socios || []);
            mostrarClases(datos.clases || []);
            document.getElementById('status').innerText = "Sincronizado con la nube ☁️";
        } catch (error) {
            document.getElementById('status').innerText = "Error al conectar con la nube ⚠️";
        }
    }

    async function guardarEnNube(socios, clases) {
        try {
            document.getElementById('status').innerText = "Guardando...";
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ socios, clases })
            });
            document.getElementById('status').innerText = "Sincronizado con la nube ☁️";
        } catch (error) {
            document.getElementById('status').innerText = "Error al guardar ⚠️";
        }
    }

    async function agregarSocio() {
        let input = document.getElementById('nombreSocio');
        let nombre = input.value.trim();
        if(!nombre) return alert("Escribe un nombre");

        let respuesta = await fetch(API_URL);
        let datos = await respuesta.json();
        let socios = datos.socios || [];
        let clases = datos.clases || [];

        socios.push(nombre);
        input.value = "";
        
        await guardarEnNube(socios, clases);
        mostrarSocios(socios);
        mostrarClases(clases);
    }

    async function agregarClase() {
        let input = document.getElementById('nombreClase');
        let clase = input.value.trim();
        if(!clase) return alert("Escribe el nombre de la clase");

        let respuesta = await fetch(API_URL);
        let datos = await respuesta.json();
        let socios = datos.socios || [];
        let clases = datos.clases || [];

        clases.push(clase);
        input.value = "";
        
        await guardarEnNube(socios, clases);
        mostrarSocios(socios);
        mostrarClases(clases);
    }

    function mostrarSocios(socios) {
        let lista = document.getElementById('listaSocios');
        lista.innerHTML = "";
        socios.forEach(s => {
            lista.innerHTML += `<li>👤 ${s}</li>`;
        });
    }

    function mostrarClases(clases) {
        let lista = document.getElementById('listaClases');
        lista.innerHTML = "";
        clases.forEach(c => {
            lista.innerHTML += `<li>🏓 ${c}</li>`;
        });
    }

    // Cargar al iniciar
    cargarDatos();
</script>

</body>
</html>
