<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Pickleball</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111827;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(31, 41, 55, 0.7);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }
        h1 {
            color: #00e6ac;
            margin-bottom: 0.5rem;
        }
        button {
            background-color: #00e6ac;
            color: #111827;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola, Natxmad! 🎾</h1>
        <p>Si ves esta página, el sistema de subida funciona correctamente.</p>
        <button onclick="alert('¡Todo conectado con éxito!')">Púlsame</button>
    </div>
</body>
</html>
